name: Firmware CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLATFORMIO_DISABLE_UPGRADE_CHECK: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: python -m pip install --disable-pip-version-check platformio==6.2.0

      - name: Build ESP32-WROOM firmware
        run: pio run -e esp32dev

      - name: Verify DMX/GPTimer IRAM safety contract
        shell: bash
        run: |
          set -euo pipefail
          CONFIG=".pio/build/esp32dev/config/sdkconfig.h"
          test -f "$CONFIG"
          grep -qx '#define CONFIG_GPTIMER_ISR_IRAM_SAFE 1' "$CONFIG"
          grep -qx '#define CONFIG_GPTIMER_CTRL_FUNC_IN_IRAM 1' "$CONFIG"
          grep -q -- '-DCONFIG_DMX_ISR_IN_IRAM=1' platformio.ini

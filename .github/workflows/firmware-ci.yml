name: Firmware CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLATFORMIO_DISABLE_UPGRADE_CHECK: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test dormant v2 assignment contract (host)
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -Isrc \
            src/assignment_v2.cpp tests/assignment_v2_test.cpp \
            -o /tmp/stagecore-assignment-v2-test
          /tmp/stagecore-assignment-v2-test

      - name: Install PlatformIO
        run: python -m pip install --disable-pip-version-check platformio==6.2.0

      - name: Build ESP32-WROOM firmware (unchanged v1 default)
        run: pio run -e esp32dev

      - name: Build experimental v2 blackout-only image (do not flash)
        run: pio run -e esp32dev-v2-experimental

      - name: Build opt-in experimental v2 software probe image (do not flash)
        run: pio run -e esp32dev-v2-probe-experimental

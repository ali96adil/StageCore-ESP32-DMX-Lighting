[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.12.0
framework = espidf
board = esp32dev
monitor_speed = 115200
board_build.partitions = stagecore_partitions.csv
board_build.cmake_extra_args =
  -DSDKCONFIG_DEFAULTS="sdkconfig.defaults"
lib_deps =
  https://github.com/joseluu/esp_dmx.git#931d62c1ee6c9ddb0f5274e6da7808d3e923b6f0
build_flags =
  -DSTAGECORE_FW_VERSION=\"0.2.0-dev.1\"
  -DSTAGECORE_DMX_TX_GPIO=17
  -DSTAGECORE_DMX_RTS_GPIO=21
  -DSTAGECORE_DMX_UNIVERSE_SIZE=12
  # esp_dmx is built as a PlatformIO library, so its root Kconfig is not
  # imported into the application Kconfig tree. Keep the upstream DMX ISR
  # gate explicit; sdkconfig.defaults enables the matching ESP-IDF 5.5
  # GPTimer cache/IRAM-safe options for every derived v2 image as well.
  -DCONFIG_DMX_ISR_IN_IRAM=1

; WARNING: CI-only opt-in. Not production-qualified or approved for flashing.
; Accepts Hub-owned v2 assignment.state, software blackout challenges and
; non-activating BLOCKED epoch ACK/receipt; NO snapshot activation or commands.
; Requires a compatible source-only Core Hub; do not flash show hardware.
[env:esp32dev-v2-experimental]
extends = env:esp32dev
build_flags =
  ${env:esp32dev.build_flags}
  -DSTAGECORE_EXPERIMENTAL_DEVICE_V2=1

; CI-only opt-in atop the blackout-only v2 image. Must use compatible Hub
; Draft #258; not production-qualified and NOT approved for show hardware.
[env:esp32dev-v2-probe-experimental]
extends = env:esp32dev-v2-experimental
build_flags =
  ${env:esp32dev-v2-experimental.build_flags}
  -DSTAGECORE_EXPERIMENTAL_V2_STATE_PROBE=1


; SOURCE-ONLY activation image stacked on the blackout/probe v2 candidate.
; It may accept show commands only after authenticated Hub ACTIVE scope,
; published configuration hash verification and a fresh zero-output reconnect
; acknowledgment. Never flash show hardware before attended qualification.
[env:esp32dev-v2-active-experimental]
extends = env:esp32dev-v2-probe-experimental
build_flags =
  ${env:esp32dev-v2-probe-experimental.build_flags}
  -DSTAGECORE_EXPERIMENTAL_V2_LIGHTING_ACTIVE=1
